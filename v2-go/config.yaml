# 复制为 config.yaml 后修改
mysql:
  host: 127.0.0.1
  port: 3306
  user: repl
  password: "CHANGE_ME"
  server_id: 8811        # 集群内必须唯一

filter:
  databases: [shop]
  emit_ddl: false

producer:
  type: redis
  redis:
    addr: 127.0.0.1:6379
    stream: binlog:events

checkpoint:
  driver: file
  path: var/checkpoint.json

runtime:
  batch_size: 200
  fullsync_batch: 1000
  # 全量同步是否包含视图
  # 视图数据来自基表，会与基表数据重复入队，下游需按 table 区分
  include_views: false
